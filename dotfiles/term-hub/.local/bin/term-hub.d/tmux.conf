# Catppuccin Frappe / Blue. Dedicated socket; no global tmux changes.
set -g default-terminal 'tmux-256color'
set -as terminal-features ',xterm*:RGB,foot*:RGB,alacritty:RGB'
set -g prefix C-b
unbind C-a
bind C-b send-prefix
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 20000
set -g escape-time 10
set -g focus-events on
setw -g automatic-rename off
setw -g allow-rename off
set -g window-style 'bg=#303446,fg=#c6d0f5'
set -g window-active-style 'bg=#303446,fg=#c6d0f5'
set -g pane-border-style 'fg=#414559'
set -g pane-active-border-style 'fg=#8caaee'
set -g pane-border-status top
set -g pane-border-format ' #{pane_index} · #{@ssh_label} '
set -g display-panes-colour '#a5adce'
set -g display-panes-active-colour '#8caaee'
set -g message-style 'bg=#414559,fg=#c6d0f5'
set -g mode-style 'bg=#8caaee,fg=#232634'
set -g status 2
set -g status-interval 2
set -g status-style 'bg=#232634,fg=#a5adce'
set -g status-left-length 20
set -g status-left '#[bg=#8caaee,fg=#232634,bold] term-hub #[default] '
set -g status-right-length 65
set -g status-right '#[range=user|tab,bg=#{?#{==:#{@term_hub_mode},Tab},#8caaee,#414559},fg=#{?#{==:#{@term_hub_mode},Tab},#232634,#c6d0f5}] Tab #[default,norange] | #[range=user|multi,bg=#{?#{==:#{@term_hub_mode},Multi},#8caaee,#414559},fg=#{?#{==:#{@term_hub_mode},Multi},#232634,#c6d0f5}] Multi #[default,norange] | #[range=user|tiling,bg=#{?#{==:#{@term_hub_mode},Tiling},#8caaee,#414559},fg=#{?#{==:#{@term_hub_mode},Tiling},#232634,#c6d0f5}] Tiling #[default,norange] | #[range=user|zoom,bg=#{?window_zoomed_flag,#8caaee,#414559},fg=#{?window_zoomed_flag,#232634,#c6d0f5}] Zoom #[default,norange]  #h '
setw -g window-status-format ' #I · #W '
setw -g window-status-current-format '#[bg=#8caaee,fg=#232634,bold] #I · #W * #[default]'
set -g status-format[1] '#[bg=#292c3c,fg=#a5adce] #(term-hub status) #[align=right] Ctrl+b h monitor | ? ajuda '
set -g popup-style 'bg=#303446,fg=#c6d0f5'
set -g popup-border-style 'fg=#8caaee'
bind -T prefix ? display-popup -E -w 85% -h 85% -T ' Atalhos do Term Hub · q para fechar ' 'less -~ "$HOME/.local/bin/term-hub.d/atalhos.txt"'
bind r select-layout main-vertical
bind X display-popup -E -w 80% -h 80% -T ' Fechar painéis ' 'term-hub close-many'
bind n display-popup -E -w 70% -h 30% -T ' Renomear painel ' 'term-hub rename #{pane_id}'
bind < run-shell 'term-hub move left'
bind > run-shell 'term-hub move right'
bind t run-shell 'term-hub mode Tab'
bind m run-shell 'term-hub mode Multi'
bind v display-menu -T 'Modo de exibição' 'Tab — uma janela por conexão' t 'run-shell "term-hub mode Tab"' 'Multi — terminais lado a lado' m 'run-shell "term-hub mode Multi"' 'Tiling — grade equilibrada' g 'run-shell "term-hub mode Tiling"'
bind f run-shell 'term-hub follow-logs'
bind c run-shell 'term-hub new'
bind s display-popup -E -w 80% -h 80% -T ' SSH ' 'term-hub connect'
bind T display-popup -E -w 70% -h 30% -T ' SSH temporário ' 'term-hub temporary'
bind e display-popup -E -w 90% -h 90% -T ' SSH fixo ' 'nvim "$HOME/.local/bin/term-hub.d/ssh.conf"; chmod 600 "$HOME/.local/bin/term-hub.d/ssh.conf"'
bind | split-window -h -c '#{pane_current_path}' \; select-pane -T term
bind - split-window -v -c '#{pane_current_path}' \; select-pane -T term
bind Left select-pane -L
bind Right select-pane -R
bind Up select-pane -U
bind Down select-pane -D
bind -n MouseDown1Status if-shell -F '#{==:#{mouse_status_range},tab}' { run-shell 'term-hub mode Tab' } { if-shell -F '#{==:#{mouse_status_range},multi}' { run-shell 'term-hub mode Multi' } { if-shell -F '#{==:#{mouse_status_range},tiling}' { run-shell 'term-hub mode Tiling' } { if-shell -F '#{==:#{mouse_status_range},zoom}' { resize-pane -Z } { select-window -t = } } } }

bind h display-popup -E -w 90% -h 85% -T ' Term Hub | monitor local ' 'term-hub top'
