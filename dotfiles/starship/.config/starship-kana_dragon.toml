add_newline = false
palette = "kana_dragon"
format = """\
[](fg:olive)\
$os\
[](bg:olive fg:slate)\
$username\
[](bg:slate fg:sand)\
$directory\
[ ](fg:sand)\
$git_branch\
$git_status\
$all\
$character"""

[username]
show_always = true
format = '[$user ](bg:slate fg:black)'
disabled = false

[os]
disabled = false
style = 'bg:olive fg:silver'
