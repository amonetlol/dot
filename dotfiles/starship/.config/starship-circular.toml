# Starship de UMA cor so: todos os nomes de cor viram o destaque do tema (#2b2b2b) via paleta do starship;
# texto sobre os segmentos = tom escuro do tema; unica excecao: o simbolo de erro (x) fica vermelho.
# Gerado pelo theme-apply.sh (render) a partir deste template. Base: starship (1).toml enviado pelo usuario.
palette = "theme"

format = """\
[](fg:blue)\
$os\
[](bg:blue fg:red)\
$username\
[](bg:red fg:green)\
$directory\
[ ](fg:green)\
$git_branch\
$git_status\
$all\
$character"""

[username]
show_always = true
format = '[$user ](bg:red fg:black)'
disabled = false

[os]
disabled = false
style = 'bg:blue fg:black'
[os.symbols]
Alpaquita = " "
Alpine = " "
AlmaLinux = " "
Amazon = " "
Android = " "
Arch = " "
Artix = " "
CachyOS = " "
CentOS = " "
Debian = " "
DragonFly = " "
Emscripten = " "
EndeavourOS = " "
Fedora = " "
FreeBSD = " "
Garuda = "󰛓 "
Gentoo = " "
HardenedBSD = "󰞌 "
Illumos = "󰈸 "
Kali = " "
Linux = " "
Mabox = " "
Macos = " "
Manjaro = " "
Mariner = " "
MidnightBSD = " "
Mint = " "
