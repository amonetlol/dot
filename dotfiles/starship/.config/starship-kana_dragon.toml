Windows = "󰍲 "

[cmd_duration]
disabled = true
format = "[$duration](fg:red)"

[directory]
format = "[$path](bg:sand fg:black)"
truncation_length = 2
truncation_symbol = "…/"

[character]
success_symbol = "[](bold sand)"
error_symbol = "[✗](bold error_red)"
disabled = false

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Scripts" = "󰲋 "

[fossil_branch]
symbol = "  "
format = '[$symbol($version)]($style)'

[git_branch]
style = "fg:brick"
symbol = "  "
format = '[$symbol($branch) ($version)]($style)'

[git_commit]
tag_symbol = '  '
format = '[$symbol($version)]($style)'

